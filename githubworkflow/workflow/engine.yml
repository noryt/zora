name: Zora Sentinel Engine
on:
  schedule:
    - cron: '*/5 * * * *' # Se ejecuta cada 5 minutos gratis
  workflow_dispatch: # Permite ejecutarlo manualmente

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: pip install pandas supabase coinbase-python python-dotenv
      - name: Run Engine Scan
        env:
          CB_API_KEY: ${{ secrets.CB_API_KEY }}
          CB_API_SECRET: ${{ secrets.CB_API_SECRET }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python engine.py 